<div class="page-wrapper">
  <div class="scroll-area">
    <div class="container-funcionarios">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb-minimal">
            <li>
              <a routerLink="/home" title="Home">
                <i class="fa-solid fa-house"></i>
              </a>
            </li>
            <li>
              <a routerLink="/home/_cad">Cadastro</a>
            </li>
            <li class="active">Transportadoras</li>
          </ol>
        </nav>

        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" (click)="nova()"
            title="Cadastrar uma nova transportadora" data-bs-toggle="tooltip">
            <i class="fa-solid fa-plus me-1"></i> Nova Transportadora
          </button>
        </div>
      </div>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Nome</th>
            <th>CNPJ</th>
            <th>Telefone</th>
            <th>Email</th>
            <th>Status</th>
            <th width="120" class="text-center">Ações</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let t of transportadoras">
            <td>{{ t.nome }}</td>
            <td>{{ t.cnpj }}</td>
            <td>{{ t.telefone }}</td>
            <td>{{ t.email }}</td>
            <td>
              <span class="badge" [ngClass]="t.ativo ? 'bg-success' : 'bg-secondary'"
                [title]="t.ativo ? 'Transportadora disponível para uso' : 'Transportadora desativada'"
                data-bs-toggle="tooltip">
                {{ t.ativo ? 'Ativa' : 'Inativa' }}
              </span>
            </td>
            <td class="text-center">
              <button class="btn btn-warning btn-sm" (click)="editar(t)" title="Editar dados da transportadora"
                data-bs-toggle="tooltip">
                <i class="fa fa-pen"></i>
              </button>
              <button class="btn btn-danger btn-sm ms-1" (click)="excluir(t)" title="Excluir transportadora"
                data-bs-toggle="tooltip">
                <i class="fa fa-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="transportadoras?.length === 0">
            <td colspan="6" class="text-center text-muted">Nenhuma transportadora cadastrada.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
