<div class="page-wrapper">
  <div class="scroll-area">
    <div class="container-funcionarios">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb-minimal">
            <li>
              <a routerLink="/home" title="Home">
                <i class="fa-solid fa-house"></i>
              </a>
            </li>
            <li>
              <a routerLink="/home/_cad">Cadastro</a>
            </li>
            <li class="active">Funções</li>
          </ol>
        </nav>

        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" (click)="novaFuncao()"
            title="Cadastrar uma nova função" data-bs-toggle="tooltip">
            <i class="fa-solid fa-plus me-1"></i> Nova Função
          </button>
        </div>
      </div>

      <table class="table table-striped table-hover shadow-sm rounded">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Nome da Função</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let funcao of funcoes; let i = index" [class.bg-light]="i % 2 === 0">
            <td>{{ funcao.idFuncao }}</td>
            <td>{{ funcao.nomeFuncao }}</td>
            <td class="text-center">
              <button class="btn btn-warning btn-sm me-2" (click)="editarFuncao(funcao.idFuncao!)"
                title="Editar esta função" data-bs-toggle="tooltip">
                <i class="fa fa-pen"></i>
              </button>
              <button class="btn btn-danger btn-sm" (click)="excluirFuncao(funcao)" title="Excluir esta função"
                data-bs-toggle="tooltip">
                <i class="fa fa-trash"></i>
              </button>
            </td>
          </tr>

          <tr *ngIf="funcoes.length === 0">
            <td colspan="3" class="text-center text-muted">Nenhuma função encontrada.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
