<div class="page-wrapper">
  <div class="scroll-area">
    <div class="container-funcionarios">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb-minimal">
            <li>
              <a routerLink="/home" title="Home">
                <i class="fa-solid fa-house"></i>
              </a>
            </li>
            <li>
              <a routerLink="/home/_cad">Cadastro</a>
            </li>
            <li class="active">Estados</li>
          </ol>
        </nav>

        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" (click)="novoEstado()"
            title="Adicionar um novo estado" data-bs-toggle="tooltip">
            <i class="fa-solid fa-plus me-1"></i> Novo Estado
          </button>
        </div>
      </div>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Sigla</th>
            <th>Nome</th>
            <th style="width: 120px;">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let estado of estadosPaginados">
            <td>{{ estado.siglaEstado }}</td>
            <td>{{ estado.nomeEstado }}</td>
            <td>
              <button class="btn btn-sm btn-warning me-2" (click)="editarEstado(estado.idEstado!)" title="Editar estado"
                data-bs-toggle="tooltip">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="btn btn-sm btn-danger" (click)="excluirEstado(estado.idEstado!, estado.nomeEstado)"
                title="Excluir estado" data-bs-toggle="tooltip">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>

          <tr *ngIf="estados.length === 0">
            <td colspan="3" class="text-center text-muted">Nenhum estado encontrado.</td>
          </tr>
        </tbody>
      </table>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <div class="text-muted small">
          Mostrando {{ exibicaoInicio }} - {{ exibicaoFim }} de {{ totalItens }}
        </div>

        <nav>
          <ul class="pagination pagination-sm mb-0">

            <li class="page-item" [class.disabled]="paginaAtual === 0">
              <button class="page-link" (click)="mudarPagina(paginaAtual - 1)" [disabled]="paginaAtual === 0"
                title="Página anterior" data-bs-toggle="tooltip">
                Anterior
              </button>
            </li>

            <li class="page-item" *ngFor="let p of paginas" [class.active]="p === paginaAtual"
              [hidden]="paginas.length <= 1">
              <button class="page-link" (click)="mudarPagina(p)" [title]="'Ir para a página ' + (p + 1)"
                data-bs-toggle="tooltip">
                {{ p + 1 }}
              </button>
            </li>

            <li class="page-item"
              [class.disabled]="(paginaAtual + 1) * itensPorPagina >= estados.length || estados.length === 0">
              <button class="page-link" (click)="mudarPagina(paginaAtual + 1)"
                [disabled]="(paginaAtual + 1) * itensPorPagina >= estados.length || estados.length === 0"
                title="Próxima página" data-bs-toggle="tooltip">
                Próxima
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
