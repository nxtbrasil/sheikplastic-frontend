<div class="page-wrapper">
  <div class="scroll-area">
    <div class="container-funcionarios">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb-minimal">
            <li>
              <a routerLink="/home" title="Home">
                <i class="fa-solid fa-house"></i>
              </a>
            </li>
            <li>
              <a routerLink="/home/_cad">Cadastro</a>
            </li>
            <li class="active">Produtos</li>
          </ol>
        </nav>

        <div class="d-flex align-items-center gap-2">

          <div style="width: 280px;">
            <input type="text" class="form-control form-control-sm" [(ngModel)]="filtroNome"
              (keyup.enter)="aplicarFiltro()" placeholder="Filtrar por nome do produto..." />
          </div>

          <button class="btn btn-primary btn-sm" (click)="aplicarFiltro()" title="Buscar produtos">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>

          <button class="btn btn-outline-secondary btn-sm" (click)="limparFiltro()" title="Limpar busca">
            <i class="fa-solid fa-eraser"></i>
          </button>

          <div class="vr mx-1" style="height: 20px;"></div>

          <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" (click)="novoProduto()"
            title="Cadastrar um novo produto">
            <i class="fa-solid fa-plus me-1"></i> Novo Produto
          </button>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-12">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Valor Compra</th>
                <th>Valor Venda</th>
                <th>Unidade</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let p of produtosPaginados">
                <td>{{ p.nomeProduto }}</td>
                <td>{{ p.valorCompra | currency:'BRL' }}</td>
                <td>{{ p.valorVenda | currency:'BRL' }}</td>
                <td>{{ p.unidadeProduto }}</td>
                <td class="text-center">
                  <button class="btn btn-sm btn-warning me-2" (click)="editarProduto(p.idProduto!)"
                    title="Editar detalhes do produto" data-bs-toggle="tooltip">
                    <i class="fa fa-pen"></i>
                  </button>
                  <button class="btn btn-sm btn-danger" (click)="excluirProduto(p!)"
                    title="Remover produto permanentemente" data-bs-toggle="tooltip">
                    <i class="fa fa-trash"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="totalItens === 0">
                <td colspan="5" class="text-center text-muted">Nenhum produto encontrado.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
          <div class="text-muted small">
            Mostrando {{ exibicaoInicio }} - {{ exibicaoFim }} de {{ totalItens }}
          </div>

          <nav>
            <ul class="pagination pagination-sm mb-0">
              <li class="page-item" [class.disabled]="paginaAtual === 0">
                <button class="page-link" (click)="mudarPagina(paginaAtual - 1)" [disabled]="paginaAtual === 0"
                  title="Página anterior" data-bs-toggle="tooltip">
                  Anterior
                </button>
              </li>

              <li class="page-item" *ngFor="let p of paginas" [class.active]="p === paginaAtual"
                [hidden]="paginas.length <= 1">
                <button class="page-link" (click)="mudarPagina(p)" [title]="'Ir para a página ' + (p + 1)"
                  data-bs-toggle="tooltip">
                  {{ p + 1 }}
                </button>
              </li>

              <li class="page-item" [class.disabled]="(paginaAtual + 1) * itensPorPagina >= totalItens">
                <button class="page-link" (click)="mudarPagina(paginaAtual + 1)"
                  [disabled]="(paginaAtual + 1) * itensPorPagina >= totalItens" title="Próxima página"
                  data-bs-toggle="tooltip">
                  Próxima
                </button>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>
</div>
