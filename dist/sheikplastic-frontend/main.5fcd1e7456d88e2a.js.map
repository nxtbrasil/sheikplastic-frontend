<div class="page-wrapper">
  <div class="scroll-area">
    <div class="container-funcionarios">
<div class="d-flex justify-content-between align-items-center mb-3">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb-minimal">
      <li>
        <a routerLink="/home" title="Home">
          <i class="fa-solid fa-house"></i>
        </a>
      </li>
      <li>
        <a routerLink="/home/_cad">Cadastro</a>
      </li>
      <li class="active">Cidades</li>
    </ol>
  </nav>

  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" 
            (click)="novaCidade()" 
            title="Cadastrar uma nova cidade no sistema" 
            data-bs-toggle="tooltip">
      <i class="fa-solid fa-plus me-1"></i> Nova Cidade
    </button>
  </div>
</div>

      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Estado</th>
              <th class="text-center" style="width: 120px;">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let cidade of cidadesPaginadas">
              <td>{{ cidade.nomeCidade }}</td>
              <td>{{ cidade.estado?.nomeEstado }}</td>
              <td class="text-center">
                <button class="btn btn-sm btn-warning me-2" 
                        (click)="editarCidade(cidade.idCidade!)"
                        title="Editar nome ou estado desta cidade" 
                        data-bs-toggle="tooltip">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button class="btn btn-sm btn-danger" 
                        (click)="excluirCidade(cidade!)"
                        title="Excluir esta cidade permanentemente" 
                        data-bs-toggle="tooltip">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </td>
            </tr>

            <tr *ngIf="cidades.length === 0">
              <td colspan="3" class="text-center text-muted py-4">Nenhuma cidade encontrada.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3 pb-3">
        <div class="text-muted small">
          Mostrando <strong>{{ exibicaoInicio }} - {{ exibicaoFim }}</strong> de {{ totalItens }}
        </div>

        <nav>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" [class.disabled]="paginaAtual === 0">
              <button class="page-link" 
                      (click)="mudarPagina(paginaAtual - 1)" 
                      [disabled]="paginaAtual === 0"
                      title="Voltar para a página anterior" 
                      data-bs-toggle="tooltip">
                Anterior
              </button>
            </li>

            <li class="page-item" *ngFor="let p of paginas" [class.active]="p === paginaAtual"
                [hidden]="paginas.length <= 1">
              <button class="page-link" (click)="mudarPagina(p)">{{ p + 1 }}</button>
            </li>

            <li class="page-item"
                [class.disabled]="(paginaAtual + 1) * itensPorPagina >= cidades.length || cidades.length === 0">
              <button class="page-link" 
                      (click)="mudarPagina(paginaAtual + 1)"
                      [disabled]="(paginaAtual + 1) * itensPorPagina >= cidades.length || cidades.length === 0"
                      title="Ir para a próxima página" 
                      data-bs-toggle="tooltip">
                Próxima
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
