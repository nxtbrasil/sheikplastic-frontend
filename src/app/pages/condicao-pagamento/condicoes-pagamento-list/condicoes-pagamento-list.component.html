<div class="page-wrapper">
  <div class="scroll-area">
    <div class="container-funcionarios">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb-minimal">
            <li>
              <a routerLink="/home" title="Home">
                <i class="fa-solid fa-house"></i>
              </a>
            </li>
            <li>
              <a routerLink="/home/_cad">Cadastro</a>
            </li>
            <li class="active">Condições de Pagamento</li>
          </ol>
        </nav>

        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" (click)="novo()"
            title="Cadastrar nova condição de pagamento" data-bs-toggle="tooltip">
            <i class="fa-solid fa-plus me-1"></i> Nova Condição
          </button>
        </div>
      </div>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Descrição</th>
            <th style="width: 150px;">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cond of condicoesPaginas">
            <td>{{ cond.descricaoCondicaoPagamento }}</td>
            <td>
              <button class="btn btn-warning btn-sm me-2" (click)="editar(cond.idCondicaoPagamento)"
                title="Editar esta condição" data-bs-toggle="tooltip">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="btn btn-danger btn-sm" (click)="excluir(cond.idCondicaoPagamento)"
                title="Excluir esta condição" data-bs-toggle="tooltip">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>

          <tr *ngIf="condicoes.length === 0">
            <td colspan="2" class="text-center text-muted">Nenhuma condição encontrada.</td>
          </tr>
        </tbody>
      </table>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <div class="text-muted small">
          Mostrando {{ exibicaoInicio }} - {{ exibicaoFim }} de {{ totalItens }}
        </div>

        <nav>
          <ul class="pagination pagination-sm mb-0">

            <li class="page-item" [class.disabled]="paginaAtual === 0">
              <button class="page-link" (click)="mudarPagina(paginaAtual - 1)" [disabled]="paginaAtual === 0"
                title="Ir para a página anterior" data-bs-toggle="tooltip">
                Anterior
              </button>
            </li>

            <li class="page-item" *ngFor="let p of paginas" [class.active]="p === paginaAtual"
              [hidden]="paginas.length <= 1">
              <button class="page-link" (click)="mudarPagina(p)" [title]="'Ir para a página ' + (p + 1)"
                data-bs-toggle="tooltip">
                {{ p + 1 }}
              </button>
            </li>

            <li class="page-item"
              [class.disabled]="(paginaAtual + 1) * itensPorPagina >= condicoes.length || condicoes.length === 0">
              <button class="page-link" (click)="mudarPagina(paginaAtual + 1)"
                [disabled]="(paginaAtual + 1) * itensPorPagina >= condicoes.length || condicoes.length === 0"
                title="Ir para a próxima página" data-bs-toggle="tooltip">
                Próxima
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
